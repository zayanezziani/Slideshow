<style>
  /* =============================================
     CUSTOMIZATION — Edit these values
     --ss-scroll-duration : speed of one full loop
     --ss-ticker-gap      : space between copies
     ============================================= */

  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

  .ss-root {
    --ss-scroll-duration: 35s;
    --ss-ticker-gap: 248px;

    position: relative;
    width: 100%;
    height: 100vh;
    background: #000000;
    overflow: hidden;
    font-family: 'Playfair Display', Georgia, serif;
  }

  /* Background text — visible between the two strips */
  .ss-bg-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 56px;
    font-weight: 700;
    color: #ffffff;
    opacity: 0.9;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    z-index: 1;
    letter-spacing: 0.02em;
    line-height: 1.15;
  }

  /* Ticker containers */
  .ss-ticker {
    position: absolute;
    left: 0;
    width: 100%;
    overflow: hidden;
    z-index: 2;
  }

  .ss-ticker-top {
    top: 0;
    height: 48%;
  }

  .ss-ticker-bottom {
    bottom: 0;
    height: 42%;
  }

  /* Ticker track — the scrolling <ul> */
  .ss-ticker-track {
    display: flex;
    gap: var(--ss-ticker-gap);
    list-style: none;
    margin: 0;
    padding: 0;
    height: 100%;
    width: max-content;
    will-change: transform;
  }

  .ss-ticker-track li {
    flex-shrink: 0;
    height: 100%;
  }

  .ss-ticker-track li img {
    display: block;
    height: 100%;
    width: auto;
  }

  /* Left-scrolling animation (top strip) */
  .ss-ticker-left {
    animation: ss-scroll-left var(--ss-scroll-duration) linear infinite;
  }

  /* Right-scrolling animation (bottom strip) */
  .ss-ticker-right {
    animation: ss-scroll-right var(--ss-scroll-duration) linear infinite;
  }

  @keyframes ss-scroll-left {
    from {
      transform: translateX(0);
    }
    to {
      transform: translateX(calc(-50% - var(--ss-ticker-gap) / 2));
    }
  }

  @keyframes ss-scroll-right {
    from {
      transform: translateX(calc(-50% - var(--ss-ticker-gap) / 2));
    }
    to {
      transform: translateX(0);
    }
  }

  /* Pause on hover */
  .ss-root:hover .ss-ticker-track {
    animation-play-state: paused;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .ss-root {
      height: 70vh;
    }
    .ss-bg-text {
      font-size: 36px;
    }
    .ss-ticker-top {
      height: 45%;
    }
    .ss-ticker-bottom {
      height: 40%;
    }
  }

  @media (max-width: 480px) {
    .ss-root {
      height: 50vh;
    }
    .ss-bg-text {
      font-size: 24px;
    }
  }
</style>
