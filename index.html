<!-- CUSTOMIZATION: Swap image URLs in src below   -->
<!-- TOP_IMAGE  = top strip (scrolls left)         -->
<!-- BOTTOM_IMAGE = bottom strip (scrolls left)     -->

<div class="ss-root">

  <!-- Top ticker — scrolls left -->
  <div class="ss-ticker ss-ticker-top">
    <ul class="ss-ticker-track ss-ticker-left">
      <!-- TOP_IMAGE — replace both src values with the same URL -->
      <li><img src="https://framerusercontent.com/images/O2YNsM4ov4pfI3ZTHZt80R69RA.png" alt=""></li>
      <li><img src="https://framerusercontent.com/images/O2YNsM4ov4pfI3ZTHZt80R69RA.png" alt=""></li>
    </ul>
  </div>

  <!-- Bottom ticker — scrolls left (slower) -->
  <div class="ss-ticker ss-ticker-bottom">
    <ul class="ss-ticker-track ss-ticker-left">
      <!-- BOTTOM_IMAGE — replace both src values with the same URL -->
      <li><img src="https://framerusercontent.com/images/iB9kc1p4KO0KI5vGLJGTGPjy4U.png" alt=""></li>
      <li><img src="https://framerusercontent.com/images/iB9kc1p4KO0KI5vGLJGTGPjy4U.png" alt=""></li>
    </ul>
  </div>
</div>

<style>
  /* =============================================
     CUSTOMIZATION — Edit these values
     --ss-scroll-duration-top/bottom : speed per strip
     --ss-ticker-gap      : space between copies
     ============================================= */

  .ss-root {
    --ss-scroll-duration-top: 50s;
    --ss-scroll-duration-bottom: 70s;
    --ss-ticker-gap: 248px;

    position: relative;
    width: 100%;
    height: 1222px;
    background: #000000;
    overflow: hidden;
  }

  /* Ticker containers */
  .ss-ticker {
    position: absolute;
    left: 0;
    width: 100%;
    overflow: hidden;
    z-index: 2;
  }

  .ss-ticker-top {
    top: 0;
    height: 692px;
  }

  .ss-ticker-bottom {
    bottom: 0;
    height: 692px;
  }

  /* Ticker track — the scrolling <ul> */
  .ss-ticker-track {
    display: flex;
    gap: var(--ss-ticker-gap);
    list-style: none;
    margin: 0;
    padding: 0;
    height: 100%;
    width: max-content;
    will-change: transform;
  }

  .ss-ticker-track li {
    flex-shrink: 0;
    height: 100%;
  }

  .ss-ticker-track li img {
    display: block;
    height: 100%;
    width: auto;
  }

  /* Left-scrolling animation — top (faster) */
  .ss-ticker-top .ss-ticker-left {
    animation: ss-scroll-left var(--ss-scroll-duration-top) linear infinite;
  }

  /* Left-scrolling animation — bottom (slower) */
  .ss-ticker-bottom .ss-ticker-left {
    animation: ss-scroll-left var(--ss-scroll-duration-bottom) linear infinite;
  }

  @keyframes ss-scroll-left {
    from {
      transform: translateX(0);
    }
    to {
      transform: translateX(calc(-50% - var(--ss-ticker-gap) / 2));
    }
  }

  /* Pause on hover */
  .ss-root:hover .ss-ticker-track {
    animation-play-state: paused;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .ss-root {
      height: 855px;
    }
    .ss-ticker-top {
      height: 484px;
    }
    .ss-ticker-bottom {
      height: 484px;
    }
  }

  @media (max-width: 480px) {
    .ss-root {
      height: 611px;
    }
    .ss-ticker-top {
      height: 346px;
    }
    .ss-ticker-bottom {
      height: 346px;
    }
  }
</style>
